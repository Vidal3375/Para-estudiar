<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para estudiar</title>
<link rel="icon" href="pomodoro/favicon-32.png" type="image/png">
<style>
  :root { --bg: #f8f6f3; --card: #fdfcfa; --text: #3f3a37; --muted: #7f7975; --border: #e6e1db; --acento: #b5675a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1b1a; --card: #252322; --text: #e6e1dc; --muted: #a39c96; --border: #3a3633; --acento: #d99384; }
  }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
  h1 { margin: 0 0 20px; }
  a.tarjeta { display: block; background: var(--card); border: 1px solid var(--border); border-radius: 14px;
              padding: 16px; margin-bottom: 12px; color: inherit; text-decoration: none; }
  a.tarjeta:hover { border-color: var(--acento); }
  a.tarjeta b { color: var(--acento); font-size: 1.1rem; }
  a.tarjeta span { display: block; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>Para estudiar</h1>
  <a class="tarjeta" href="pomodoro/"><b>Pomodoro</b><span>Temporizador para estudiar con atención, con estadísticas, sonidos y citas.</span></a>
  <a class="tarjeta" href="autodefinido/"><b>Autodefinido de Historia de España</b><span>Con el vocabulario de Historia de España: elige el periodo y la dificultad.</span></a>
</main>
</body>
</html>
